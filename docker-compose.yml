
services:
  postgres:
    image: postgres:17-alpine
    container_name: office_management_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: office_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}"
      POSTGRES_DB: office_management

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office_user -d office_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
